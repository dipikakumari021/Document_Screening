name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check + model forward-pass smoke test
        run: |
          python -c "
          import torch
          from models.classifier.model import build_model as build_classifier
          from models.segmenter.model import build_model as build_segmenter
          from models.type_classifier.model import build_model as build_type_classifier, CLASS_NAMES

          m1 = build_classifier(pretrained=False)
          m2 = build_segmenter(arch='unet', pretrained=False)
          m3 = build_type_classifier(arch='resnet50', pretrained=False)

          x = torch.randn(1, 3, 224, 224)
          assert m1(x).shape == (1, 1)

          xs = torch.randn(1, 3, 256, 256)
          assert m2(xs).shape == (1, 1, 256, 256)

          assert m3(x).shape == (1, len(CLASS_NAMES))
          print('All three models build and forward-pass correctly.')
          "

      - name: FastAPI app import check
        run: python -c "from api.main import app; print('FastAPI app imports OK:', app.title)"
